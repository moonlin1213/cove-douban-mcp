[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "cove-douban-mcp"
version = "0.1.0"
description = "A privacy-safe, read-only Douban MCP server for local clients."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "Apache-2.0"
authors = [{ name = "Cove Douban MCP contributors" }]
keywords = ["douban", "mcp", "model-context-protocol", "opencli"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = [
  "filelock>=3.18,<4",
  "mcp>=1.28.1,<2",
  "platformdirs>=4.3,<5",
  "pydantic>=2.11,<3",
  "tomli-w>=1.2,<2",
]

[dependency-groups]
dev = [
  "build>=1.2,<2",
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1",
  "twine>=6.1,<7",
]

[project.scripts]
cove-douban-mcp = "cove_douban_mcp.cli:main"

[project.urls]
Homepage = "https://github.com/example/cove-douban-mcp"
Issues = "https://github.com/example/cove-douban-mcp/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/cove_douban_mcp"]

[tool.hatch.build.targets.wheel.force-include]
"opencli-plugin" = "cove_douban_mcp/opencli_plugin"

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/opencli-plugin",
  "/docs",
  "/examples",
  "/README.md",
  "/LICENSE",
  "/NOTICE",
  "/SECURITY.md",
  "/CONTRIBUTING.md",
  "/CHANGELOG.md",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["cove_douban_mcp"]
mypy_path = "src"

